<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0EA5E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>词趣 WordFun</title>

<div id="warning-bar" class="warning-bar" hidden></div>

    <span class="logo">词趣</span>

      <button class="tab active" data-view="dashboard">学习</button>

    </button>
  </div>
</header>

<main class="container">
  <section id="view-dashboard" class="view"></section>
  <section id="view-practice" class="view" hidden></section>
  <section id="view-library" class="view" hidden></section>
</main>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="feedback-root" class="feedback-root" aria-live="polite"></div>

<script src="data/kb.js"></script>
<script src="js/storage.js"></script>
<script src="js/srs.js"></script>
